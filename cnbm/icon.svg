  <circle cx="345" cy="352" r="11" fill="#0b5fa5"/>
  </g>
  <rect width="512" height="512" rx="96" fill="url(#eclat)"/>
  <path d="M0 96 A96 96 0 0 1 96 0 H416 A96 96 0 0 1 512 96 V230 Q256 300 0 230 Z" fill="url(#brillance)"/>
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="6"/>
