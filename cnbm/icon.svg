<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a78c9"/><stop offset="1" stop-color="#074679"/></linearGradient>
    <linearGradient id="brillance" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="eclat" cx=".28" cy=".18" r=".45"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef3f8"/><stop offset="1" stop-color="#b9c9da"/></linearGradient>
    <filter id="ombre" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="6" dy="9" stdDeviation="7" flood-color="#021a30" flood-opacity=".55"/></filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#fond)"/>
  <path d="M0 400 L512 150 L512 210 L0 460 Z" fill="#f7d618"/>
  <path d="M0 415 L512 165 L512 195 L0 445 Z" fill="#ce1021"/>
  <polygon points="84.0,40.0 96.3,75.0 133.5,75.9 104.0,98.5 114.6,134.1 84.0,113.0 53.4,134.1 64.0,98.5 34.5,75.9 71.7,75.0" fill="#f7d618" stroke="#b8860b" stroke-width="3" filter="url(#ombre)"/>
  <g transform="translate(40 0)" filter="url(#ombre)">
  <g fill="url(#metal)" stroke="#0b5fa5" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- socle -->
    <rect x="86" y="420" width="330" height="46" rx="18"/>
    <!-- bras (statif) -->
    <path d="M318 424 V318 C318 252 300 214 262 192 L284 150 C344 182 372 236 372 318 V424 Z"/>
    <!-- platine porte-lame -->
    <rect x="104" y="318" width="224" height="30" rx="9"/>
    <rect x="132" y="306" width="70" height="14" rx="4"/>
    <!-- condenseur -->
    <rect x="186" y="348" width="54" height="22" rx="5"/>
    <!-- revolver et objectifs -->
    <path d="M168 214 H268 L254 248 H182 Z"/>
    <rect x="176" y="246" width="24" height="50" rx="6"/>
    <rect x="206" y="246" width="24" height="58" rx="6"/>
    <rect x="236" y="246" width="24" height="44" rx="6"/>
    <!-- tête binoculaire -->
    <rect x="148" y="160" width="150" height="62" rx="16"/>
    <!-- deux oculaires inclinés -->
    <g transform="rotate(-24 196 160)">
      <rect x="150" y="56" width="40" height="112" rx="10"/>
      <rect x="142" y="40" width="56" height="28" rx="9"/>
    </g>
    <g transform="rotate(-24 250 160)">
      <rect x="210" y="56" width="40" height="112" rx="10"/>
      <rect x="202" y="40" width="56" height="28" rx="9"/>
    </g>
