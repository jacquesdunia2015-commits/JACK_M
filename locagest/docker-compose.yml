# Base PostgreSQL pour le développement : docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: locagest
      POSTGRES_PASSWORD: locagest
      POSTGRES_DB: locagest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/test/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
