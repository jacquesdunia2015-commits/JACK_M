# Déploie QualiCode sur GitHub Pages à chaque mise à jour de main.
# L'application est 100 % statique : le contenu du dépôt est publié tel quel
# sur la branche gh-pages (GitHub Pages se configure automatiquement sur
# cette branche pour les dépôts publics).
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Publication sur la branche gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git checkout --orphan gh-pages
          git add -A
          git commit -m "Déploiement de QualiCode (${GITHUB_SHA})"
          git push --force origin gh-pages
