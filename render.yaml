# Déploiement de LocaGest sur Render (https://render.com) en un clic :
#   https://render.com/deploy?repo=https://github.com/jacquesdunia2015-commits/JACK_M
# Render crée la base PostgreSQL et le service web, puis demande l'email et le
# mot de passe du compte administrateur. Voir locagest/DEPLOIEMENT.md.
databases:
  - name: locagest-db
    databaseName: locagest
    user: locagest
    plan: free

services:
  - type: web
    name: locagest
    runtime: node
    plan: free
    rootDir: locagest
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: locagest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Kinshasa
      - key: UPLOAD_DIR
        value: uploads
      # Emails : non configurés au départ (simulés, visibles dans les journaux).
      # Ajouter ensuite SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS et MAIL_FROM
      # dans Render > locagest > Environment (Brevo, SendGrid…).
