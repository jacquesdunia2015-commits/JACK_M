<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — NOVA PHARMA OS</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0d5a4a; color: #fff; padding: 2rem; text-align: center;
      }
      h1 { font-size: 1.3rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1.5rem; opacity: 0.9; line-height: 1.5; max-width: 30rem; }
      button {
        border: 0; border-radius: 10px; padding: 0.9rem 1.6rem;
        font-size: 1rem; font-weight: 600; background: #fff; color: #0d5a4a;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Pas de connexion</h1>
      <p>
        NOVA PHARMA OS n'affiche pas de chiffres enregistrés à l'avance : un stock
        d'hier ferait vendre un lot déjà écoulé. Rétablissez la connexion au
        serveur de la pharmacie, puis réessayez.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
