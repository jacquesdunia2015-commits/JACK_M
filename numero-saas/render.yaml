# Déploiement en un clic sur Render (https://render.com) — offre gratuite.
#
# Ce service vit dans le sous-dossier numero-saas/ du dépôt JACK_M
# (voir README.md pour le contexte) : rootDir isole le build à ce dossier.
#
# Note : sur l'offre gratuite, le disque est éphémère — la base de
# démonstration (data/db.json) est réinitialisée à chaque redéploiement.
# Pour des données durables, ajouter un disque persistant Render et pointer
# NUMEROGO_DATA vers son point de montage.
services:
  - type: web
    name: numerogo-saas
    runtime: node
    plan: free
    rootDir: numero-saas
    buildCommand: ""
    startCommand: node server.mjs
    healthCheckPath: /
    envVars:
      - key: PROVIDER_SECRET
        generateValue: true
